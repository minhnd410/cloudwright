# Cloudflare Pages.
#
# The project is Git-connected: every push to `main` builds and deploys
# automatically (build command `npm run build`, output `dist`), and every
# other branch gets its own preview URL. Set that up once, in the Cloudflare
# dashboard, under Workers & Pages → cloudwright → Settings → Build.
#
# `npm run deploy` remains as a manual override — a direct upload via
# wrangler, for deploying from a branch or a local change without pushing.

name = "cloudwright"
compatibility_date = "2026-09-15"
pages_build_output_dir = "dist"
